[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gen4understand"
version = "0.1.0"
description = "Structured action scripts for generation-for-understanding in embodied multimodal learning"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = ["numpy>=1.24,<3", "Pillow>=10", "imageio>=2.34", "imageio-ffmpeg>=0.5", "scipy>=1.10"]

[project.optional-dependencies]
train = ["torch>=2.5", "transformers>=4.57,<5", "peft>=0.17,<0.19", "accelerate>=1.0", "qwen-vl-utils>=0.0.14", "av>=12", "PyYAML>=6"]
dev = ["pytest>=8", "ruff==0.11.10", "build>=1.2"]

[project.scripts]
g4u = "gen4understand.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
